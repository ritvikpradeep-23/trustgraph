<!doctype html>
<!--
  Runs every site adapter against its saved HTML sample (test/fixtures/).
  Serve the extension folder:   cd extension && python3 -m http.server 5500
  then open http://localhost:5500/test/adapter-tests.html
  Results are listed per fixture; the page title ends with PASS or FAIL.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustGraph adapter tests</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 20px; }
    section { border: 1px solid var(--tg-border); border-radius: var(--tg-radius); padding: 12px 16px; margin: 12px 0; background: var(--tg-surface); }
    h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 4px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; }
    .pass { color: #1c8a5a; }
    .fail { color: #c62834; }
    .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--tg-ice); color: #10142c; }
    iframe { display: none; }
    @media (prefers-color-scheme: dark) { .pass { color: #4fd39a; } .fail { color: #ff8a93; } }
  </style>
</head>
<body>
  <h1>TrustGraph adapter tests</h1>
  <p id="summary" role="status">Running…</p>
  <div id="results"></div>
  <script src="adapter-tests.js"></script>
</body>
</html>
